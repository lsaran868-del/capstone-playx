services:
  # Spring Boot Backend API
  - type: web
    name: playx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SUPABASE_DB_HOST
        value: db.xrhlsbsyrzvpznuspqvh.supabase.co
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React / Vite Frontend SPA
  - type: web
    name: playx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://capstone-playx-14.onrender.com/api
      - key: VITE_SUPABASE_URL
        value: https://xrhlsbsyrzvpznuspqvh.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
