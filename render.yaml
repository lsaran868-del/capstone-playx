services:
  # Spring Boot Backend API
  - type: web
    name: playx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: playx_db
      - key: TIDB_USER
        value: 2ZJ1Px9KDCMNXAk.root
      - key: TIDB_PASSWORD
        value: yPS4MqN4GPGTYfE3
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React / Vite Frontend SPA
  - type: web
    name: playx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://playx-backend.onrender.com/api

