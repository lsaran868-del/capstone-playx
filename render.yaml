databases:
  - name: playx-db
    databaseName: playx_db
    user: playx_user
    plan: free

services:
  # Spring Boot Backend API
  - type: web
    name: playx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    disk:
      name: playx-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React / Vite Frontend SPA
  - type: web
    name: playx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://playx-backend.onrender.com/api
