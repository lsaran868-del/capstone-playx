server.address=0.0.0.0
server.port=${PORT:8080}

# MySQL Database Configuration
# Spring Boot expects a standard JDBC URL starting with jdbc:mysql://
# If DATABASE_URL or MYSQL_URL or MYSQL_PRIVATE_URL is provided in cloud environments,
# PlayxApplication.java normalizes it into spring.datasource.url before Spring starts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:${MYSQLHOST:localhost}}:${MYSQL_PORT:${MYSQLPORT:3306}}/${MYSQL_DATABASE:${MYSQLDATABASE:PlayX_db}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:${MYSQL_USER:${MYSQLUSER:root}}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:}}}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool Settings (essential for cloud database latency & reliability)
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_FILE_SIZE:50MB}

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings
jwt.secret=${JWT_SECRET:playx_super_secret_jwt_key_2026_cse_capstone_must_be_at_least_256_bits_long}
jwt.expiration=${JWT_EXPIRES_IN:${JWT_EXPIRATION:604800000}}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}