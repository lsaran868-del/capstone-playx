server.address=0.0.0.0
server.port=${PORT:5000}

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${SUPABASE_JDBC_URL:jdbc:postgresql://${SUPABASE_DB_HOST:db.xrhlsbsyrzvpznuspqvh.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (essential for cloud database latency & reliability)
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration (Supabase PostgreSQL Schema is source of truth)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_FILE_SIZE:50MB}

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings (Configured via JWT_SECRET in production - no hardcoded production secret)
jwt.secret=${JWT_SECRET:${jwt.secret:playx_super_secret_jwt_key_2026_cse_capstone}}
jwt.expiration=${JWT_EXPIRES_IN:${JWT_EXPIRATION:604800000}}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}