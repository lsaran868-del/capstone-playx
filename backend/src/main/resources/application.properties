server.address=0.0.0.0
server.port=${PORT:5000}

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${SUPABASE_JDBC_URL:jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:playx_app.xrhlsbsyrzvpznuspqvh}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:PlayX@2026Secure!}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (cloud latency resilient)
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration (Supabase PostgreSQL Schema is source of truth)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_FILE_SIZE:50MB}

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings
jwt.secret=${JWT_SECRET:playx_super_secret_jwt_key_2026_cse_capstone}
jwt.expiration=${JWT_EXPIRES_IN:${JWT_EXPIRATION:604800000}}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Email / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# PLAYX Mail Sender & Frontend URL for Verification Links
playx.mail.from=${MAIL_FROM:no-reply@playx.music}
playx.mail.from-name=${MAIL_FROM_NAME:PLAYX Music}
playx.frontend.url=${FRONTEND_URL:http://localhost:5173}