server.address=0.0.0.0
server.port=${PORT:8080}

# TiDB Cloud MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${TIDB_HOST:${MYSQLHOST:${MYSQL_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}}}:${TIDB_PORT:${MYSQLPORT:${MYSQL_PORT:4000}}}/${TIDB_DATABASE:${MYSQLDATABASE:${MYSQL_DATABASE:playx_db}}}?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TIDB_USER:${MYSQLUSER:${MYSQL_USER:2ZJ1Px9KDCMNXAk.root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TIDB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:yPS4MqN4GPGTYfE3}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (essential for cloud database latency & reliability)
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration (Auto-detects dialect for PostgreSQL & MySQL)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_FILE_SIZE:50MB}

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings (Configured via JWT_SECRET in production - no hardcoded production secret)
jwt.secret=${JWT_SECRET:${jwt.secret:}}
jwt.expiration=${JWT_EXPIRES_IN:${JWT_EXPIRATION:604800000}}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}