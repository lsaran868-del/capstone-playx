server.address=0.0.0.0
server.port=${PORT:8080}

# MySQL Database Configuration
# Spring Boot expects a standard JDBC URL starting with jdbc:mysql://
# If SPRING_DATASOURCE_URL, DATABASE_URL, or Railway/Render variables (MYSQLHOST, etc.) are provided,
# PlayxApplication.java normalizes them into spring.datasource.* properties before Spring starts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:PlayX_db}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:${DB_USERNAME:${DATABASE_USERNAME:root}}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:}}}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# HikariCP Connection Pool Settings (essential for cloud database latency & reliability)
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_AUDIO_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_AUDIO_FILE_SIZE:50MB}

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings (Configured via JWT_SECRET in production - no hardcoded production secret)
jwt.secret=${JWT_SECRET:${jwt.secret:}}
jwt.expiration=${JWT_EXPIRES_IN:${JWT_EXPIRATION:604800000}}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}