server.address=0.0.0.0
server.port=${PORT:5000}

# MySQL Database Configuration
# Supports SPRING_DATASOURCE_URL, DATABASE_URL, MYSQL_URL, or individual parameters
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:PlayX_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:${MYSQL_USER:root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD:}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (essential for cloud database latency & reliability)
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

music.storage.path=${MUSIC_STORAGE_PATH:uploads/music}
music.covers.path=${MUSIC_COVERS_PATH:uploads/covers}

# JWT Settings
jwt.secret=${JWT_SECRET:playx_super_secret_jwt_key_2026_cse_capstone_must_be_at_least_256_bits_long}
jwt.expiration=604800000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}